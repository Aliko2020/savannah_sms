name: Deploy to production

# Runs whenever a push lands on main — i.e. every time you merge/push
# finished work, this fires automatically. No manual trigger needed.
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH into server and run deploy.sh
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: bash ~/savannah_sms/deploy.sh
